name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags=integration

  # On main: precompile native binaries, then run full tests and builds
  precompile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: analyze-and-test
    uses: ./.github/workflows/precompile.yml
    secrets:
      PRECOMPILE_PRIVATE_KEY: ${{ secrets.PRECOMPILE_PRIVATE_KEY }}

  integration-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: precompile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Cap'n Proto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build native library
        working-directory: rust
        run: cargo build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Run tests (including integration, excluding backend)
        env:
          LD_LIBRARY_PATH: rust/target/debug
        run: flutter test --tags=integration --exclude-tags=backend,server_equivalence

  server-equivalence-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: precompile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Cap'n Proto
        run: sudo apt-get update && sudo apt-get install -y capnproto
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build native library
        working-directory: rust
        run: cargo build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: pip install -r test/fixtures/requirements.txt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Run server equivalence tests
        env:
          LD_LIBRARY_PATH: rust/target/debug
        run: flutter test --tags=server_equivalence

  build-android:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: precompile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create test app
        run: |
          flutter create --template=app --platforms=android /tmp/test_app
          cd /tmp/test_app
          flutter pub add flutter_concrete --path=$GITHUB_WORKSPACE
      - name: Build APK (debug)
        working-directory: /tmp/test_app
        run: flutter build apk --debug

  build-ios:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    needs: precompile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create test app
        run: |
          flutter create --template=app --platforms=ios /tmp/test_app
          cd /tmp/test_app
          flutter pub add flutter_concrete --path=$GITHUB_WORKSPACE
      - name: Build iOS (no codesign)
        working-directory: /tmp/test_app
        run: flutter build ios --no-codesign
